name: Website SEO validation

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "sitemap.xml"
      - "robots.txt"
      - ".github/workflows/site-validation.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "sitemap.xml"
      - "robots.txt"
      - ".github/workflows/site-validation.yml"

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate indexed pages, metadata, structured data and sitemap
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import json
          import re
          import xml.etree.ElementTree as ET

          SITE = "https://samani12.github.io/m3alem-pro-site/"

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title_text = ""
                  self.in_title = False
                  self.h1 = 0
                  self.canonical = None
                  self.description = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "title":
                      self.in_title = True
                  elif tag == "h1":
                      self.h1 += 1
                  elif tag == "link" and attrs.get("rel") == "canonical":
                      self.canonical = attrs.get("href")
                  elif tag == "meta" and attrs.get("name", "").lower() == "description":
                      self.description = attrs.get("content")

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title_text += data.strip()

          sitemap = ET.parse("sitemap.xml").getroot()
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locations = [node.text for node in sitemap.findall("sm:url/sm:loc", namespace)]
          assert locations, "Sitemap contains no URLs"
          assert len(locations) == len(set(locations)), "Sitemap contains duplicate URLs"

          for url in locations:
              assert url and url.startswith(SITE), f"Unexpected sitemap URL: {url}"
              path = urlparse(url).path
              relative = path.removeprefix("/m3alem-pro-site/") or "index.html"
              page = Path(relative)
              assert page.is_file(), f"Sitemap URL has no matching file: {url}"

              source = page.read_text(encoding="utf-8")
              audit = Audit()
              audit.feed(source)
              assert audit.title_text.strip(), f"{page}: missing title"
              assert audit.h1 == 1, f"{page}: expected exactly one H1, got {audit.h1}"
              assert audit.canonical == url, f"{page}: canonical mismatch ({audit.canonical})"
              assert audit.description and audit.description.strip(), f"{page}: missing meta description"

              blocks = re.findall(r'<script\s+type=["\\']application/ld\+json["\\']\s*>(.*?)</script>', source, re.S | re.I)
              assert blocks, f"{page}: missing JSON-LD"
              for block in blocks:
                  json.loads(block)
              print(f"OK {page}")

          print(f"OK sitemap.xml ({len(locations)} indexed pages)")
          PY
